name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high/critical gate)
        run: pnpm --dir apps/web audit --prod --audit-level high
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser suites (smoke, accessibility, studio flows)
        run: pnpm --dir apps/web test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/test-results/
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project apps/api --all-extras --frozen
      - name: Audit Python dependencies
        run: |
          uv export --project apps/api --format requirements-txt --no-hashes \
            | grep -v '^-' > /tmp/api-reqs.txt
          uvx pip-audit -r /tmp/api-reqs.txt
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run mypy app
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api
