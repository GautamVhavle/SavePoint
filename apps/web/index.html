<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme before first paint so system-light visitors never
      // see the dark canvas flash; mirrors ThemeProvider's resolution order.
      try {
        var theme = localStorage.getItem('savepoint-theme');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* storage blocked: CSS default (dark) still applies */ }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a12" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe6" />
    <meta name="description" content="SavePoint turns your gaming history into a collectible portfolio: your rig, Hall of Fame, reviews, awards, and the stories behind every save." />
    <meta name="application-name" content="SavePoint" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SavePoint" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.igdb.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font CSS loads off the critical path; swap keeps text visible meanwhile. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>
    <title>SavePoint · Your gaming legacy</title>
  </head>
  <body><div id="root"></div><noscript><div style="min-height:100vh;display:grid;place-items:center;font-family:sans-serif;color:#97a4be;background:#060a14;padding:24px;text-align:center"><div><p style="font-size:1.2rem;color:#ebf2ff;margin:0 0 8px">SavePoint needs JavaScript.</p><p style="margin:0">Your gaming archive is rendered entirely in the browser — enable JavaScript to enter.</p></div></div></noscript><script type="module" src="/src/main.tsx"></script></body>
</html>
